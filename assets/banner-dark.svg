<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Bruno Hart — product engineer, Auckland NZ.">
  <defs>
    <!-- ink bleed: a block of colour pushed through turbulence, so the edge
         feathers and creeps the way ink does on uncoated stock -->
    <filter id="bleedAD" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="bleedBD" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="grainD" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <mask id="blotAD" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="640">
      <rect x="-60" y="-50" width="430" height="225" rx="6" fill="#fff" filter="url(#bleedAD)" transform="rotate(-2.6 155 62)"/>
    </mask>
    <mask id="blotBD" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="640">
      <rect x="850" y="112" width="440" height="200" rx="6" fill="#fff" filter="url(#bleedBD)" transform="rotate(1.6 1070 212)"/>
    </mask>
  </defs>

  <!-- warm dark ground, never cool, never pure black -->
  <rect width="1200" height="240" fill="#17140F"/>

  <!-- ink bleeds, screened, so the ink lifts off the dark; the grain sits inside the blot,
       the sheet drinking the ink rather than a texture laid over it -->
  <g mask="url(#blotAD)" opacity="0.10" style="mix-blend-mode:screen">
    <rect x="-200" y="-200" width="1600" height="640" fill="#D4622B"/>
    <rect x="-200" y="-200" width="1600" height="640" filter="url(#grainD)" opacity="0.55" style="mix-blend-mode:multiply"/>
  </g>
  <g mask="url(#blotBD)" opacity="0.07" style="mix-blend-mode:screen">
    <rect x="-200" y="-200" width="1600" height="640" fill="#4E74B8"/>
    <rect x="-200" y="-200" width="1600" height="640" filter="url(#grainD)" opacity="0.55" style="mix-blend-mode:multiply"/>
  </g>

  <!-- misregistration ghost: the plate that did not align -->
  <text x="70" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82"
        font-weight="500" letter-spacing="-2.4" fill="#E8823F" opacity="0.20"
        transform="translate(5,4)">Bruno Hart</text>

  <!-- the mark -->
  <text x="70" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82"
        font-weight="500" letter-spacing="-2.4" fill="#F0EDE6">Bruno Hart</text>

  <text x="73" y="176" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
        font-size="15" letter-spacing="3" fill="#F0EDE6" opacity="0.58">PRODUCT ENGINEER · AUCKLAND, NZ</text>

  <!-- cue-mark -->
  <circle cx="1112" cy="60" r="15" fill="none" stroke="#E8823F" stroke-width="2.5" opacity="0.9"/>
  <circle cx="1112" cy="60" r="5.5" fill="#E8823F" opacity="0.9"/>

  <!-- paper grain -->
  <rect width="1200" height="240" filter="url(#grainD)" opacity="0.09" style="mix-blend-mode:screen"/>
</svg>
