<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="designedbybruno — design engineer. Cinema software, built by hand.">
  <defs>
    <filter id="grainD" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="frameD"><rect x="0" y="0" width="1200" height="320"/></clipPath>
  </defs>

  <g clip-path="url(#frameD)">
    <!-- warm dark ground — never cool, never pure black -->
    <rect width="1200" height="320" fill="#17140F"/>

    <!-- colour wash bleed blocks · screened rather than multiplied, so they lift off the dark -->
    <rect x="-60" y="-40" width="420" height="250" fill="#D4622B" opacity="0.07"
          transform="rotate(-2.2 150 85)" style="mix-blend-mode:screen"/>
    <rect x="880" y="120" width="420" height="260" fill="#4E74B8" opacity="0.055"
          transform="rotate(1.6 1090 250)" style="mix-blend-mode:screen"/>
    <rect x="612" y="-30" width="150" height="120" fill="#C4391D" opacity="0.055"
          transform="rotate(-3 687 30)" style="mix-blend-mode:screen"/>

    <!-- offset shadow block behind the wordmark -->
    <rect x="72" y="112" width="6" height="92" fill="#9FB6DE" opacity="0.20"/>

    <!-- misregistration ghost -->
    <text x="70" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82"
          font-weight="500" letter-spacing="-2.4" fill="#E8823F" opacity="0.20"
          transform="translate(5,4)">designedbybruno</text>

    <!-- the mark -->
    <text x="70" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82"
          font-weight="500" letter-spacing="-2.4" fill="#F0EDE6">designedbybruno</text>

    <!-- broken gradient divider -->
    <g fill="#F0EDE6" opacity="0.40">
      <rect x="72" y="216" width="196" height="1.5"/>
      <rect x="286" y="216" width="54"  height="1.5"/>
      <rect x="356" y="216" width="118" height="1.5"/>
      <rect x="492" y="216" width="18"  height="1.5"/>
    </g>

    <!-- rubber-stamp label -->
    <g transform="rotate(-0.8 70 262)">
      <rect x="70" y="242" width="352" height="34" fill="none" stroke="#F0EDE6" stroke-width="1" opacity="0.42"/>
      <text x="86" y="264" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
            font-size="12.5" letter-spacing="3.1" fill="#F0EDE6" opacity="0.70">DESIGN ENGINEER — AUCKLAND, NZ</text>
    </g>


    <!-- cue-mark -->
    <circle cx="1112" cy="62" r="15" fill="none" stroke="#E8823F" stroke-width="2.5" opacity="0.9"/>
    <circle cx="1112" cy="62" r="5.5" fill="#E8823F" opacity="0.9"/>

    <!-- paper grain -->
    <rect width="1200" height="320" filter="url(#grainD)" opacity="0.09" style="mix-blend-mode:screen"/>
  </g>
</svg>
