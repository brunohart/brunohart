<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="designedbybruno — product engineer and systems strategist. Cinema software, built by hand.">
  <defs>
    <filter id="grainL" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="frameL"><rect x="0" y="0" width="1200" height="320"/></clipPath>
  </defs>

  <g clip-path="url(#frameL)">
    <!-- parchment ground -->
    <rect width="1200" height="320" fill="#F0EDE6"/>

    <!-- colour wash bleed blocks · rotated, running off-frame -->
    <rect x="-60" y="-40" width="420" height="250" fill="#D4622B" opacity="0.055"
          transform="rotate(-2.2 150 85)" style="mix-blend-mode:multiply"/>
    <rect x="880" y="120" width="420" height="260" fill="#1B2D4F" opacity="0.05"
          transform="rotate(1.6 1090 250)" style="mix-blend-mode:multiply"/>
    <rect x="612" y="-30" width="150" height="120" fill="#C4391D" opacity="0.045"
          transform="rotate(-3 687 30)" style="mix-blend-mode:multiply"/>

    <!-- offset shadow block behind the wordmark -->
    <rect x="72" y="112" width="6" height="92" fill="#1B2D4F" opacity="0.14"/>

    <!-- misregistration ghost · the plate that did not align -->
    <text x="70" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82"
          font-weight="500" letter-spacing="-2.4" fill="#D4622B" opacity="0.10"
          transform="translate(5,4)">designedbybruno</text>

    <!-- the mark -->
    <text x="70" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82"
          font-weight="500" letter-spacing="-2.4" fill="#1A1A1A">designedbybruno</text>

    <!-- broken gradient divider · the stroke that ran out of ink -->
    <g fill="#1A1A1A" opacity="0.42">
      <rect x="72" y="216" width="196" height="1.5"/>
      <rect x="286" y="216" width="54"  height="1.5"/>
      <rect x="356" y="216" width="118" height="1.5"/>
      <rect x="492" y="216" width="18"  height="1.5"/>
    </g>

    <!-- rubber-stamp label · never quite level -->
    <g transform="rotate(-0.8 70 262)">
      <rect x="70" y="242" width="416" height="34" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.45"/>
      <text x="86" y="264" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
            font-size="12.5" letter-spacing="2.7" fill="#1A1A1A" opacity="0.72">PRODUCT ENGINEER · SYSTEMS STRATEGIST</text>
    </g>

    <!-- location · set level, so the stamp reads as the thing that slipped -->
    <text x="502" y="264" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
          font-size="11.5" letter-spacing="2.6" fill="#1A1A1A" opacity="0.5">AUCKLAND, NZ</text>

    <!-- cue-mark: the signature dot, top right -->
    <circle cx="1112" cy="62" r="15" fill="none" stroke="#D4622B" stroke-width="2.5" opacity="0.85"/>
    <circle cx="1112" cy="62" r="5.5" fill="#D4622B" opacity="0.85"/>

    <!-- paper grain -->
    <rect width="1200" height="320" filter="url(#grainL)" opacity="0.055" style="mix-blend-mode:multiply"/>
  </g>
</svg>
