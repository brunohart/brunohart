<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Bruno Hart — product engineer, Auckland NZ.">
  <defs>
    <!-- ink bleed: a block of colour pushed through turbulence, so the edge
         feathers and creeps the way ink does on uncoated stock -->
    <filter id="bleedAL" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="bleedBL" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="grainL" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <mask id="blotAL" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="640">
      <rect x="-60" y="-50" width="430" height="225" rx="6" fill="#fff" filter="url(#bleedAL)" transform="rotate(-2.6 155 62)"/>
    </mask>
    <mask id="blotBL" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="640">
      <rect x="850" y="112" width="440" height="200" rx="6" fill="#fff" filter="url(#bleedBL)" transform="rotate(1.6 1070 212)"/>
    </mask>
  </defs>

  <!-- parchment ground -->
  <rect width="1200" height="240" fill="#F0EDE6"/>

  <!-- ink bleeds, multiplied into the sheet; the grain sits inside the blot,
       the sheet drinking the ink rather than a texture laid over it -->
  <g mask="url(#blotAL)" opacity="0.11" style="mix-blend-mode:multiply">
    <rect x="-200" y="-200" width="1600" height="640" fill="#D4622B"/>
    <rect x="-200" y="-200" width="1600" height="640" filter="url(#grainL)" opacity="0.55" style="mix-blend-mode:multiply"/>
  </g>
  <g mask="url(#blotBL)" opacity="0.07" style="mix-blend-mode:multiply">
    <rect x="-200" y="-200" width="1600" height="640" fill="#1B2D4F"/>
    <rect x="-200" y="-200" width="1600" height="640" filter="url(#grainL)" opacity="0.55" style="mix-blend-mode:multiply"/>
  </g>

  <!-- misregistration ghost: the plate that did not align -->
  <text x="70" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82"
        font-weight="500" letter-spacing="-2.4" fill="#D4622B" opacity="0.10"
        transform="translate(5,4)">Bruno Hart</text>

  <!-- the mark -->
  <text x="70" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82"
        font-weight="500" letter-spacing="-2.4" fill="#1A1A1A">Bruno Hart</text>

  <text x="73" y="176" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace"
        font-size="15" letter-spacing="3" fill="#1A1A1A" opacity="0.6">PRODUCT ENGINEER · AUCKLAND, NZ</text>

  <!-- cue-mark -->
  <circle cx="1112" cy="60" r="15" fill="none" stroke="#D4622B" stroke-width="2.5" opacity="0.85"/>
  <circle cx="1112" cy="60" r="5.5" fill="#D4622B" opacity="0.85"/>

  <!-- paper grain -->
  <rect width="1200" height="240" filter="url(#grainL)" opacity="0.055" style="mix-blend-mode:multiply"/>
</svg>
